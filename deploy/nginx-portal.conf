# Include inside the existing server block. Preserve /portal/ at both gateway hops.
# Replace PORTAL_HOST with the portal address reachable from this Nginx.
location = /portal {
    return 308 /portal/$is_args$args;
}

location ^~ /portal/ {
    # No trailing slash: the portal service receives the complete original URI.
    proxy_pass http://PORTAL_HOST:3001;
}
